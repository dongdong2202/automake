# ====================================================================
# AI 短剧剧本生成系统 (novel2 - Port 8001) 反向代理配置
# ====================================================================

# HTTP 服务 (端口 80)
server {
    listen 80;
    server_name novel.tinylab.store;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.19.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# HTTPS 服务 (端口 443)
server {
    listen 443 ssl;
    server_name novel.tinylab.store;

    ssl_certificate /etc/nginx/certs/live/tinylab.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/tinylab.store/privkey.pem;

    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.19.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
