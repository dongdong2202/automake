server {
    listen 80;
    server_name tinylab.store;

    # ACME-challenge validation path for Certbot
    location /.well-known/acme-challenge/ {
        root /app/static/;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tinylab.store;

    ssl_certificate /etc/nginx/certs/live/tinylab.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/tinylab.store/privkey.pem;

    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 静态文件目录
    location /static/ {
        alias /app/static/;
    }

    # 媒体文件目录
    location /media/ {
        alias /app/media/;
    }

    # WebSocket 代理（上位机 Django Channels）
    # 必须放在 location / 之前，优先匹配 /ws/ 路径
    location /ws/ {
        proxy_pass http://172.19.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # 长连接，1 小时超时
        proxy_send_timeout 3600s;
    }

    # 屏蔽常见的恶意扫描文件后缀及路径（直接返回 444 关闭连接，不浪费流量）
    location ~* \.(php|aspx?|jsp|cgi|pl|py|sh|bash|env|git|yml|yaml|ini|sql|conf|bak)$ {
        return 444;
    }

    # 拦截 /robots.txt，由 Nginx 直接响应，不再转发给 Django
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /admin/\nDisallow: /api/\n";
    }

    # 仅反向代理业务请求（admin、api、simulator、payment-test）至宿主机运行的 Django/Daphne 服务器
    location ~ ^/(admin|api|simulator|payment-test)/ {
        proxy_pass http://172.19.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 托管 Vue 3 前端运营管理系统 SPA
    location / {
        root /app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 WebSocket 连接至 EMQX (8083端口)
    location /mqtt {
        proxy_pass http://emqx:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 反向代理 VLESS WebSocket 至宿主机运行的 Xray 服务 (10086端口)
    location /tinylab-vless {
        if ($http_upgrade != "websocket") {
            return 404;
        }
        proxy_redirect off;
        proxy_pass http://172.19.0.1:10086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
