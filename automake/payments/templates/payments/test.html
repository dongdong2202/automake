<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信支付真实测试控制台 (Native扫码 & 付款码)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #10b981;
            color: #059669;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- 顶部标题 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                        <svg class="w-8 h-8 text-emerald-600" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8.5 2C4.36 2 1 4.91 1 8.5c0 2.02 1.04 3.82 2.68 5.01L3 17l3.85-1.28c.52.14 1.07.28 1.65.28.17 0 .34 0 .5-.02C9.8 17.21 11.75 18 14 18c4.14 0 7.5-2.91 7.5-6.5S18.14 5 14 5c-.34 0-.67.02-1 .06C11.83 3.2 10.27 2 8.5 2z"/>
                        </svg>
                        微信支付真实测试控制台
                    </h1>
                    <p class="text-sm text-gray-500 mt-1">支持 Native 扫码支付（主扫）与 付款码支付（被扫）真实 0.01 元交易与 MQTT 硬件调度</p>
                </div>
                <div class="text-right">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                        ● 真实支付环境 (0.01元)
                    </span>
                </div>
            </div>
        </div>

        <!-- 1. 快速创建测试订单卡片 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-sm">1</span>
                选择或创建待支付订单
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">测试门店</label>
                    <select id="storeSelect" class="w-full border-gray-300 rounded-lg shadow-sm border p-2 text-sm">
                        {% for store in stores %}
                            <option value="{{ store.id }}">{{ store.name }} (ID: {{ store.id }})</option>
                        {% empty %}
                            <option value="1">默认测试门店 (ID: 1)</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">目标设备</label>
                    <select id="deviceSelect" class="w-full border-gray-300 rounded-lg shadow-sm border p-2 text-sm">
                        {% for dev in devices %}
                            <option value="{{ dev.device_sn }}" {% if dev.device_sn == 'sn005' %}selected{% endif %}>{{ dev.device_name }} ({{ dev.device_sn }})</option>
                        {% empty %}
                            <option value="sn005" selected>咖啡机器人 (sn005)</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">测试商品 (固定 0.01 元)</label>
                    <select id="itemSelect" class="w-full border-gray-300 rounded-lg shadow-sm border p-2 text-sm">
                        {% for item in items %}
                            <option value="{{ item.id }}">{{ item.name }}</option>
                        {% empty %}
                            <option value="1">大师拿铁 (0.01元)</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <button onclick="createTestOrder()" id="btnCreateOrder" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm text-sm transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    一键创建 0.01 元测试订单
                </button>
                <div class="flex items-center gap-2 flex-1">
                    <span class="text-sm text-gray-500">或手动输入订单号:</span>
                    <input type="text" id="manualOrderNo" placeholder="如: 20260825202234258503" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm flex-1">
                    <button onclick="loadManualOrder()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium">载入</button>
                </div>
            </div>

            <!-- 当前选中的订单信息条 -->
            <div id="currentOrderBar" class="mt-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg hidden flex justify-between items-center text-sm">
                <div>
                    <span class="text-emerald-900 font-semibold">当前操作订单：</span>
                    <span id="displayOrderNo" class="font-mono font-bold text-emerald-800"></span>
                    <span class="ml-3 text-emerald-700 font-medium">金额：<span id="displayOrderAmount" class="font-bold text-red-600">￥0.01</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500">状态：</span>
                    <span id="displayOrderStatus" class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800">待支付</span>
                </div>
            </div>
        </div>

        <!-- 2. 支付方式选项卡与操作台 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
            <div class="flex border-b border-gray-200">
                <button onclick="switchTab('native')" id="tabNative" class="flex-1 py-4 text-center font-medium text-sm active-tab flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    方式一：Native 扫码支付 (用户主扫)
                </button>
                <button onclick="switchTab('codepay')" id="tabCodepay" class="flex-1 py-4 text-center font-medium text-sm text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    方式二：付款码支付 (设备被扫)
                </button>
            </div>

            <!-- Native 扫码区 -->
            <div id="sectionNative" class="p-6">
                <div class="flex flex-col items-center">
                    <button onclick="generateNativeQR()" id="btnGenQR" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm text-sm transition mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        生成 Native 支付二维码
                    </button>

                    <!-- 二维码展示容器 -->
                    <div id="qrWrapper" class="hidden flex flex-col items-center p-6 bg-gray-50 rounded-xl border border-gray-200">
                        <div id="qrcode" class="p-3 bg-white rounded-lg shadow-inner"></div>
                        <p class="text-sm font-semibold text-gray-800 mt-4 flex items-center gap-2">
                            <span class="animate-pulse w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            请使用微信 App「扫一扫」进行真实支付
                        </p>
                        <p class="text-xs text-gray-400 mt-1 font-mono" id="codeUrlText"></p>
                        <div class="mt-3 flex items-center gap-2 text-xs text-gray-500">
                            <span>系统每 2 秒自动轮询订单支付状态...</span>
                        </div>
                    </div>

                    <!-- 支付成功祝贺卡片 -->
                    <div id="paySuccessCard" class="hidden w-full p-6 bg-emerald-50 border border-emerald-300 rounded-xl text-center">
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-emerald-900">微信支付成功！已确认入账</h3>
                        <p class="text-sm text-emerald-700 mt-1" id="successDetailText">交易号已记录，制作任务已创建，MQTT 下发指令成功。</p>
                    </div>
                </div>
            </div>

            <!-- 付款码被扫区 -->
            <div id="sectionCodepay" class="p-6 hidden">
                <div class="max-w-lg mx-auto">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            微信付款码 (auth_code)
                        </label>
                        <div class="relative">
                            <input type="text" id="authCodeInput" maxlength="18" placeholder="打开微信【收付款】条形码下方18位数字" 
                                   class="w-full border-2 border-emerald-500 rounded-lg p-3 text-lg font-mono tracking-wider focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                        <p class="text-xs text-gray-400 mt-1">支持扫码枪直接扫入（扫码枪自动回车触发扣款）</p>
                    </div>

                    <button onclick="submitCodePay()" id="btnSubmitCodePay" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm text-base transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        立即发起真实扣款 (0.01元)
                    </button>

                    <!-- 付款码结果提示框 -->
                    <div id="codePayResultBox" class="mt-4 p-4 rounded-lg hidden text-sm"></div>
                </div>
            </div>
        </div>

        <!-- 3. 实时交互与调用日志 -->
        <div class="bg-gray-900 rounded-xl shadow-sm p-5 text-gray-100 font-mono text-xs">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800">
                <span class="text-emerald-400 font-bold">API 调用与 MQTT 下发实时日志</span>
                <button onclick="clearLogs()" class="text-gray-400 hover:text-gray-200">清空日志</button>
            </div>
            <div id="logConsole" class="space-y-1.5 max-h-60 overflow-y-auto">
                <div class="text-gray-500">[System] 支付控制台就绪，请先创建或载入待支付订单...</div>
            </div>
        </div>
    </div>

    <script>
        let currentOrderNo = '';
        let pollTimer = null;
        let qrcodeInstance = null;

        function log(msg, type = 'info') {
            const consoleDiv = document.getElementById('logConsole');
            const time = new Date().toLocaleTimeString();
            const colors = {
                info: 'text-gray-300',
                success: 'text-emerald-400 font-bold',
                warn: 'text-amber-400',
                error: 'text-rose-400 font-bold'
            };
            const div = document.createElement('div');
            div.className = colors[type] || 'text-gray-300';
            div.innerHTML = `[${time}] ${msg}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logConsole').innerHTML = '';
        }

        function switchTab(tab) {
            if (tab === 'native') {
                document.getElementById('tabNative').className = 'flex-1 py-4 text-center font-medium text-sm active-tab flex items-center justify-center gap-2';
                document.getElementById('tabCodepay').className = 'flex-1 py-4 text-center font-medium text-sm text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2';
                document.getElementById('sectionNative').classList.remove('hidden');
                document.getElementById('sectionCodepay').classList.add('hidden');
            } else {
                document.getElementById('tabCodepay').className = 'flex-1 py-4 text-center font-medium text-sm active-tab flex items-center justify-center gap-2';
                document.getElementById('tabNative').className = 'flex-1 py-4 text-center font-medium text-sm text-gray-500 hover:text-gray-700 flex items-center justify-center gap-2';
                document.getElementById('sectionCodepay').classList.remove('hidden');
                document.getElementById('sectionNative').classList.add('hidden');
            }
        }

        // 1. 创建测试订单
        async function createTestOrder() {
            const storeId = document.getElementById('storeSelect').value;
            const deviceSn = document.getElementById('deviceSelect').value;
            const itemId = document.getElementById('itemSelect').value;

            log(`正在创建 0.01 元测试订单: store_id=${storeId}, device_sn=${deviceSn}...`);
            try {
                const res = await fetch('/api/pay/test/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_id: parseInt(storeId),
                        device_sn: deviceSn,
                        item_id: parseInt(itemId)
                    })
                });
                const data = await res.json();
                if (data.code === 0 || data.code === 200) {
                    const order = data.data;
                    currentOrderNo = order.order_no;
                    log(`订单创建成功: order_no=${currentOrderNo}, 金额: ￥${(order.pay_amount / 100).toFixed(2)}`, 'success');
                    updateOrderBar(order.order_no, '￥0.01', '待支付');
                } else {
                    log(`创建订单失败: ${data.message}`, 'error');
                    alert(`创建订单失败: ${data.message}`);
                }
            } catch (e) {
                log(`网络请求异常: ${e}`, 'error');
            }
        }

        function loadManualOrder() {
            const val = document.getElementById('manualOrderNo').value.trim();
            if (!val) return alert('请输入订单号');
            currentOrderNo = val;
            updateOrderBar(currentOrderNo, '以实付为准', '已载入');
            log(`已手动关联订单号: ${currentOrderNo}`);
        }

        function updateOrderBar(no, amount, status) {
            document.getElementById('displayOrderNo').innerText = no;
            document.getElementById('displayOrderAmount').innerText = amount;
            document.getElementById('displayOrderStatus').innerText = status;
            document.getElementById('currentOrderBar').classList.remove('hidden');
            
            // 重置二维码与结果框
            document.getElementById('qrWrapper').classList.add('hidden');
            document.getElementById('paySuccessCard').classList.add('hidden');
            document.getElementById('codePayResultBox').classList.add('hidden');
            if (pollTimer) clearInterval(pollTimer);
        }

        // 2. Native 扫码支付
        async function generateNativeQR() {
            if (!currentOrderNo) {
                alert('请先创建或载入待支付订单！');
                return;
            }
            log(`向 Django 请求 Native 支付二维码: order_no=${currentOrderNo}...`);
            try {
                const res = await fetch('/api/pay/wechat/native', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: currentOrderNo })
                });
                const data = await res.json();
                if (data.code === 0 || data.code === 200) {
                    const codeUrl = data.data.code_url;
                    log(`Native 下单成功，code_url=${codeUrl}`, 'success');
                    
                    // 渲染二维码
                    const qrContainer = document.getElementById('qrcode');
                    qrContainer.innerHTML = '';
                    qrcodeInstance = new QRCode(qrContainer, {
                        text: codeUrl,
                        width: 200,
                        height: 200,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });

                    document.getElementById('codeUrlText').innerText = codeUrl;
                    document.getElementById('qrWrapper').classList.remove('hidden');
                    document.getElementById('paySuccessCard').classList.add('hidden');

                    // 开启轮询
                    startPolling(currentOrderNo);
                } else {
                    log(`生成二维码失败: ${data.message}`, 'error');
                    alert(`生成二维码失败: ${data.message}`);
                }
            } catch (e) {
                log(`请求二维码异常: ${e}`, 'error');
            }
        }

        // 3. 付款码被扫支付
        async function submitCodePay() {
            if (!currentOrderNo) {
                alert('请先创建或载入待支付订单！');
                return;
            }
            const authCode = document.getElementById('authCodeInput').value.trim();
            if (!authCode || authCode.length < 16) {
                alert('请输入正确的 18 位微信付款码！');
                return;
            }

            const deviceSn = document.getElementById('deviceSelect').value;
            log(`发起微信付款码支付扣款: order_no=${currentOrderNo}, auth_code=${authCode.substring(0, 6)}******...`);
            
            const resultBox = document.getElementById('codePayResultBox');
            resultBox.className = 'mt-4 p-4 rounded-lg text-sm bg-blue-50 border border-blue-200 text-blue-800';
            resultBox.innerHTML = '正在与微信支付网关通信扣款中...';
            resultBox.classList.remove('hidden');

            try {
                const res = await fetch('/api/internal/payments/wechat/codepay/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_no: currentOrderNo,
                        auth_code: authCode,
                        device_sn: deviceSn
                    })
                });
                const data = await res.json();
                const resData = data.data || {};

                if (resData.status === 'success' || data.code === 0) {
                    log(`付款码扣款成功！微信交易号: ${resData.transaction_id}`, 'success');
                    resultBox.className = 'mt-4 p-4 rounded-lg text-sm bg-emerald-50 border border-emerald-300 text-emerald-900 font-bold';
                    resultBox.innerHTML = `✅ 付款码支付成功！微信交易号: ${resData.transaction_id}，制作指令已下发！`;
                    document.getElementById('displayOrderStatus').innerText = '制作中 (PAID)';
                    document.getElementById('displayOrderStatus').className = 'px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800';
                } else if (resData.status === 'userpaying') {
                    log(`用户正在手机端输入密码，开始查单轮询...`, 'warn');
                    resultBox.className = 'mt-4 p-4 rounded-lg text-sm bg-amber-50 border border-amber-300 text-amber-900';
                    resultBox.innerHTML = `⏳ 用户支付中，请在微信手机端输入密码... 系统已自动开始轮询最终结果`;
                    startPolling(currentOrderNo);
                } else {
                    log(`付款码扣款失败: ${data.message || resData.message}`, 'error');
                    resultBox.className = 'mt-4 p-4 rounded-lg text-sm bg-rose-50 border border-rose-300 text-rose-900';
                    resultBox.innerHTML = `❌ 扣款失败: ${data.message || resData.message}`;
                }
            } catch (e) {
                log(`付款码请求异常: ${e}`, 'error');
            }
        }

        // 4. 轮询订单支付状态
        function startPolling(orderNo) {
            if (pollTimer) clearInterval(pollTimer);
            log(`启动支付状态自动轮询 (每 2 秒)...`);

            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/orders/${orderNo}/payment-status/`);
                    const data = await res.json();
                    const statusData = data.data || {};

                    if (statusData.paid) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                        log(`[POLL] 订单 ${orderNo} 确认支付成功！状态=${statusData.order_status}`, 'success');

                        // 更新界面展示
                        document.getElementById('qrWrapper').classList.add('hidden');
                        document.getElementById('paySuccessCard').classList.remove('hidden');
                        document.getElementById('displayOrderStatus').innerText = '制作中 (PAID)';
                        document.getElementById('displayOrderStatus').className = 'px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800';

                        const resultBox = document.getElementById('codePayResultBox');
                        if (!resultBox.classList.contains('hidden')) {
                            resultBox.className = 'mt-4 p-4 rounded-lg text-sm bg-emerald-50 border border-emerald-300 text-emerald-900 font-bold';
                            resultBox.innerHTML = `✅ 支付成功！订单状态: ${statusData.order_status}，制作指令已下发！`;
                        }
                    }
                } catch (e) {
                    console.error('轮询查询异常:', e);
                }
            }, 2000);
        }

        // 扫码枪自动提交监听
        document.getElementById('authCodeInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter' && this.value.length >= 16) {
                submitCodePay();
            }
        });
    </script>
</body>
</html>
